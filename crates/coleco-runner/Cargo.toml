[package]
name = "coleco-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Dev harnesses for ColecoRust: test-ROM runs, headless renders, and HLE-versus-real-BIOS differential runs."

# Boot a cartridge and step it. The first harness, and the one that stays
# useful longest.
[[bin]]
name = "coleco"
path = "src/coleco.rs"

# Corpus smoke: every cartridge under a directory, one derived verdict each.
[[bin]]
name = "smoke"
path = "src/smoke.rs"

# BIOS census: what each title calls, reads and depends on, on the real BIOS.
[[bin]]
name = "census"
path = "src/census.rs"

# The machine as the BIOS leaves it at hand-over, and what every title shares.
[[bin]]
name = "handover"
path = "src/handover.rs"

# Z80 conformance: ZEXDOC then ZEXALL, on a minimal test bus. Lifted from
# MegaRust with the CPU.
[[bin]]
name = "zexall"
path = "src/zexall.rs"

[dependencies]
coleco-core = { path = "../coleco-core" }
